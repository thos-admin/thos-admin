<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>THOS Admin</title>
<meta name="theme-color" content="#0b1320">
<link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0613/0515/9770/files/Untitled_design_13.png?v=1723892185">
<link rel="alternate icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1320'/%3E%3Cpath d='M12 30 32 13l20 17v21H12z' fill='none' stroke='%23FFC629' stroke-width='5' stroke-linejoin='round'/%3E%3Crect x='27' y='35' width='10' height='10' fill='%23FFC629'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b1320; --night-2:#131e33; --lamp:#FFC629;
  --bg:#f3f5f8; --card:#ffffff; --ink:#0b1320; --ink-2:#47526a; --muted:#6b7690; --line:#e3e7ee; --line-2:#d3d9e3;
  --income:#4170c0; --expense:#b97f00; /* chart: money in vs out */
  --good:#18794e; --good-bg:#e6f4ec; --warn:#94600a; --warn-bg:#fdf3dc; --bad:#b4232c; --bad-bg:#fde8e8; --info:#2c5aa0; --info-bg:#e7eefa; --mute-bg:#eef0f4;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif; --body:"Hanken Grotesk",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.num,td.money,th.money{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
[hidden]{display:none !important}

/* login */
.login{min-height:100vh;display:grid;place-items:center;background:var(--night);padding:20px}
.login form{width:min(380px,100%);background:var(--night-2);border:1px solid #25344f;border-radius:10px;padding:36px 30px;color:#eef1f6}
.login svg{width:44px;height:44px;margin-bottom:18px}
.login h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin-bottom:6px}
.login p{color:#93a0b8;margin-bottom:24px}
.login input{width:100%;padding:13px 14px;border-radius:6px;border:1.5px solid #2c3c5b;background:var(--night);color:#eef1f6;margin-bottom:14px}
.login input:focus{outline:none;border-color:var(--lamp)}
.login .err{color:#ff9b8a;font-size:14px;min-height:20px;margin:-4px 0 10px}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--night);color:#c5cddc;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:20px 12px}
.side-brand{display:flex;align-items:center;gap:10px;padding:2px 10px 22px;color:#fff;text-decoration:none}
.side-brand svg{width:30px;height:30px}
.brand-logo{display:block;max-width:100%;height:auto;max-height:64px;object-fit:contain}
.side-brand .brand-logo{max-height:58px}
.login .brand-logo{max-height:84px;margin:0 auto 22px 0}
.topbar .brand-logo{max-height:36px;max-width:160px}
.side-brand .logo-fallback{display:flex;align-items:center;gap:10px}
.has-logo .logo-fallback,.side-brand.has-logo .logo-fallback{display:none}
.side-brand b{font-family:var(--display);font-weight:800;font-size:20px;line-height:1}
.side-group{font-size:12px;font-weight:600;color:#5f6e8b;padding:16px 12px 6px}
.side a.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:6px;text-decoration:none;color:#c5cddc;font-weight:500;position:relative}
.side a.nav:hover{background:#131e33;color:#fff}
.side a.nav.active{background:#18253c;color:#fff}
.side a.nav.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--lamp)}
.badge{background:var(--lamp);color:var(--night);font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.side-foot{margin-top:auto;padding:16px 12px 4px;display:flex;flex-direction:column;gap:8px}
.side-foot a,.side-foot button{color:#93a0b8;font-size:14px;text-decoration:none;text-align:left}
.side-foot a:hover,.side-foot button:hover{color:#fff}
.topbar{display:none}
main{padding:28px 32px 60px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-family:var(--display);font-weight:800;font-size:38px;line-height:1}
.page-head .sub{color:var(--muted);margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:6px;font-weight:600;font-size:14px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--night);border-color:var(--night);color:#fff}
.btn.primary:hover{background:#1c2a44}
.btn.lamp{background:var(--lamp);border-color:var(--lamp);color:var(--night)}
.btn.danger{color:var(--bad);border-color:#f0c4c6}
.btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:wait}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{padding:9px 12px;border:1.5px solid var(--line-2);border-radius:6px;background:var(--card)}
.toolbar input[type=search]{min-width:240px;flex:1;max-width:340px}
.toolbar .count{margin-left:auto;color:var(--muted);font-size:14px}

/* cards & tables */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px 10px}
.card-h h2{font-size:16px;font-weight:700}
.card-h a,.card-h button{font-size:14px;font-weight:600;color:var(--info)}
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfc}
.t th.money,.t th.num{text-align:right}
.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:#f7f9fc}
.t tfoot td{font-weight:700;background:#fafbfc;border-bottom:0}
.t td strong{font-weight:600}
.t .muted{color:var(--muted)}
.t tr.static{cursor:default}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:var(--mute-bg);color:var(--ink-2)}
.neg{color:var(--bad)}
.pos{color:var(--good)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi .k-label{color:var(--muted);font-size:13px;font-weight:600}
.kpi .k-val{font-size:26px;font-weight:700;letter-spacing:-.01em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .k-note{font-size:13px;color:var(--muted);margin-top:4px}
.kpi.alert .k-val{color:var(--bad)}
button.kpi.pick{text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%;transition:border-color .15s,box-shadow .15s}
button.kpi.pick:hover{border-color:var(--line-2);box-shadow:0 6px 18px -10px rgba(11,19,32,.35)}
button.kpi.pick.on{border-color:var(--night);box-shadow:inset 0 0 0 1px var(--night)}
button.kpi.pick .go{color:var(--info);opacity:0;transition:opacity .15s}
button.kpi.pick:hover .go,button.kpi.pick.on .go{opacity:1}
a.kpi{text-decoration:none;color:inherit;display:block}
a.kpi:hover{border-color:var(--line-2)}
.dash-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.chart-card{padding-bottom:12px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chart{position:relative;padding:4px 18px 0}
.chart svg{width:100%;height:260px;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--night);color:#fff;font-size:13px;padding:8px 10px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;z-index:3;box-shadow:0 6px 18px rgba(11,19,32,.25)}
.tip b{display:block;margin-bottom:2px}
.tip span{display:flex;justify-content:space-between;gap:14px}
.list{list-style:none}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;border-top:1px solid var(--line);font-size:14px}
.list li .sub{color:var(--muted);font-size:13px}
.list li > div:last-child{text-align:right;white-space:nowrap}

/* statement */
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.section{margin-top:18px}
.info-row{display:flex;gap:22px;flex-wrap:wrap;color:var(--ink-2);margin-top:8px;font-size:14px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:14px;margin-bottom:10px}
.back:hover{color:var(--ink)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(11,19,32,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:60;overflow-y:auto}
.modal{background:var(--card);border-radius:12px;width:min(620px,100%);box-shadow:0 30px 80px rgba(11,19,32,.35)}
.modal.wide{width:min(900px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:18px;font-weight:700}
.modal-x{width:34px;height:34px;border-radius:6px;font-size:22px;line-height:1;color:var(--muted)}
.modal-x:hover{background:var(--bg);color:var(--ink)}
.modal-b{padding:20px 22px}
.modal-f{display:flex;justify-content:space-between;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:#fafbfc;border-radius:0 0 12px 12px;flex-wrap:wrap}
.modal-f .right{display:flex;gap:8px;margin-left:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:6px}
.f.full,.fgrid > .full{grid-column:1/-1}
.fgrid > .actions{align-items:center}
.f label{font-size:13px;font-weight:600;color:var(--ink-2)}
.f input,.f select,.f textarea{padding:10px 12px;border:1.5px solid var(--line-2);border-radius:6px;background:#fff;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--night)}
.f textarea{min-height:84px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.form-err{color:var(--bad);font-size:14px;font-weight:500;margin-top:12px}

/* invoice editor */
.items{width:100%;border-collapse:collapse;margin-top:6px}
.items th{font-size:12px;color:var(--muted);text-align:left;padding:6px 6px;font-weight:600}
.items td{padding:4px 6px;vertical-align:top}
.items input{width:100%;padding:9px 10px;border:1.5px solid var(--line-2);border-radius:6px}
.items input:focus{outline:none;border-color:var(--night)}
.items .rm{width:32px;height:38px;color:var(--muted);font-size:20px}
.items .rm:hover{color:var(--bad)}
.inv-total{display:flex;justify-content:flex-end;gap:24px;font-weight:700;font-size:18px;margin-top:12px;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kv div{background:var(--bg);border-radius:8px;padding:10px 12px}
.kv span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kv b{font-size:17px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--night);color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;font-size:14px;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.err{background:var(--bad)}

/* retainer grid */
.rgrid{overflow-x:auto}
.app > div{min-width:0}
.rgrid table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.rgrid th{font-size:12px;font-weight:600;color:var(--muted);padding:10px 4px;text-align:center;background:#fafbfc;border-bottom:1px solid var(--line);white-space:nowrap}
.rgrid th:first-child,.rgrid td:first-child{position:sticky;left:0;z-index:1;text-align:left;background:#fff;padding:8px 14px;min-width:190px;border-right:1px solid var(--line)}
.rgrid th:first-child{background:#fafbfc;z-index:2}
.rgrid td{padding:4px 3px;border-bottom:1px solid var(--line);text-align:center}
.rgrid tr.off td:first-child strong{color:var(--muted)}
.rgrid th.now{color:var(--ink);background:#fff6d6}
.rgrid td.now{background:#fffbeb}
.rgrid .fee{font-size:12px;color:var(--muted);font-weight:500}
.rgrid td.owed{white-space:nowrap;text-align:right;padding-right:14px;font-variant-numeric:tabular-nums}
.rc{width:100%;min-width:58px;height:30px;border-radius:7px;font-size:12px;font-weight:700;border:1px solid transparent;transition:transform .1s}
.rc:hover{box-shadow:0 0 0 2px var(--night)}
.rc:active{transform:scale(.96)}
.c-rec{background:#e3f3ea;color:#18794e}
.c-x{background:#fde4e4;color:#b4232c}
.c-na{background:transparent;color:#a3abba;font-weight:500}
.c-up{background:#fff;border:1px dashed #d3d9e3;color:transparent}
.legend-row{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:0 0 12px}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}
.s-rec{background:#18794e}.s-not_rec{background:#d23b3b}.s-na{background:#c3c9d4}.s-up{border:1.5px dashed #a3abba}
.smenu{position:absolute;z-index:95;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -12px rgba(11,19,32,.35);padding:6px;min-width:190px}
.smenu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;font-size:14px;font-weight:500;text-align:left}
.smenu button:hover{background:var(--bg)}
.smenu button.on{font-weight:700;background:var(--bg)}
.smenu .hd{font-size:12px;color:var(--muted);padding:6px 10px 4px;font-weight:600}
.tog{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;border:1.5px solid transparent;white-space:nowrap}
.tog.on{background:var(--good-bg);color:var(--good)}
.tog.off{background:var(--mute-bg);color:var(--ink-2)}
.tog:hover{border-color:currentColor}
.ystrip{display:grid;grid-template-columns:70px repeat(12,minmax(0,1fr));gap:4px;align-items:center;padding:6px 18px}
.ystrip .yl{font-weight:700;font-size:14px}
.ystrip .ml{font-size:11px;color:var(--muted);text-align:center}
.tx-in{color:var(--good)} .tx-out{color:var(--bad)}
.m-only{display:none}
body.limited .side .nav:not(.allow), body.limited .side-group, body.limited .side-foot .own{display:none}
.clock{padding:22px;margin-bottom:16px}
.clock .big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.clock .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:14px}
.clock .row > *{flex:1 1 220px}
.clock .row .btn{flex:0 0 auto;padding:12px 22px;font-size:16px}
.clock select,.clock input{width:100%;padding:11px 12px;border:1px solid var(--line-2);border-radius:10px;font:inherit;background:#fff}
.btn.go{background:var(--good);color:#fff;border-color:var(--good)}
.btn.stop{background:var(--bad);color:#fff;border-color:var(--bad)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--good)}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.now-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.now-chips span{background:var(--good-bg);color:var(--good);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.side-foot .who{display:block;font-size:12px;color:#8a94a8;margin-bottom:6px}
.lead-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.lead-head .card{padding:14px 16px}
.lead-head .big{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.lead-head .sm{font-size:13px;color:var(--muted);margin-top:3px}
.days{width:100%;border-collapse:collapse;font-size:13px}
.days th,.days td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.days th:first-child,.days td:first-child{text-align:left}
.days th{color:var(--muted);font-weight:600}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:0}
.tl .t1{font-weight:600}
.tl .t2{font-size:13px;color:var(--muted);margin-top:2px}
.tl .note{margin-top:6px;white-space:pre-wrap;font-size:14px}
.tl img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.proof-drop{border:1.5px dashed var(--line-2);border-radius:10px;padding:14px;text-align:center;cursor:pointer;color:var(--muted);font-size:14px;display:block}
.proof-drop:hover{border-color:var(--night);color:var(--ink)}
.proof-drop img{max-height:160px;max-width:100%;border-radius:8px;display:block;margin:0 auto 8px}
.proof-drop input{display:none}
.lead-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 18px;font-size:14px;margin-bottom:14px}
.lead-info b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
@media (max-width:700px){ .toolbar input[type=search]{flex-basis:100%} table.t.bank{min-width:0;width:100%} .t.bank td:last-child{white-space:nowrap} .t.bank .d-only{display:none} .t.bank .m-only{display:block} }
@media (max-width:1100px){ .kpis,.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))} .dash-grid{grid-template-columns:1fr} }
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:70;transform:translateX(-100%);transition:transform .25s}
  .app.menu .side{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.35)}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--night);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:50}
  .topbar b{font-family:var(--display);font-weight:800;font-size:20px}
  .topbar button{color:#fff;width:40px;height:40px;font-size:22px}
  main{padding:20px 14px 60px}
  .page-head h1{font-size:32px}
  .fgrid{grid-template-columns:1fr}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toolbar input[type=search]{min-width:0;max-width:none;width:100%}
  .kpi .k-val{font-size:22px}
}
@media print{ .side,.topbar,.actions,.toolbar{display:none !important} .app{display:block} main{padding:0} }
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <form id="loginForm">

<script>
(() => {
/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v) => Number(v || 0);
const money = (v, dash) => {
  const n = num(v);
  if (dash && !n) return '<span class="muted">–</span>';
  const s = Math.abs(n).toFixed(2).split('.');
  return (n < 0 ? '−' : '') + 'R ' + s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + '.' + s[1];
};
const moneyShort = (n) => { n = num(n); const a = Math.abs(n); return (n < 0 ? '−' : '') + 'R ' + (a >= 1e6 ? (a/1e6).toFixed(1) + 'm' : a >= 1e3 ? (a/1e3).toFixed(a >= 1e4 ? 0 : 1) + 'k' : a.toFixed(0)); };
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dt = (s) => { if (!s) return '<span class="muted">–</span>'; const [y,m,d] = String(s).slice(0,10).split('-'); return `${+d} ${MONTHS[m-1]} ${y}`; };
const mon = (s) => { if (!s) return '–'; const [y,m] = String(s).slice(0,7).split('-'); return `${MONTHS[m-1]} ${y}`; };
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); };
const waNum = (p) => { let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '27' + d.slice(1); return d; };
const PILL = {
  active:'good', paid:'good', won:'good', completed:'mute', ended:'mute', cancelled:'mute', void:'mute', lost:'mute', draft:'mute',
  paused:'warn', partial:'warn', follow_up:'warn', quoted:'info', contacted:'info', unpaid:'info', sent:'info', new:'warn', overdue:'bad', retainer:'info', project:'mute',
};
const pill = (s) => s ? `<span class="pill ${PILL[s] || 'mute'}">${esc(s[0].toUpperCase() + s.slice(1).replace(/_/g, ' '))}</span>` : '';

let token = localStorage.getItem('thos_token');
let ME = null;               // { role: 'admin' | 'sales', name }
const isOwner = () => !!ME && ME.role === 'admin';
const homeView = () => !ME ? '' : ME.role === 'admin' ? 'dashboard' : ME.role === 'staff' ? 'time' : 'leads';
const cache = {};

async function api(path, opts = {}) {
  const r = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/login') { logout(j.error); throw new Error(j.error || 'Log in again.'); }
  if (!r.ok) throw new Error(j.error || 'The server could not complete that request.');
  return j;
}
const A = (p, o) => api('/admin' + p, o);

function toast(msg, err) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 4500 : 2600);
}

/* ================= auth ================= */
function showLogin(msg) {
  $('#app').hidden = true; $('#login').hidden = false;
  $('#loginErr').textContent = msg || '';
  setTimeout(() => $('#pw').focus(), 50);
}
function logout(msg) { token = null; ME = null; localStorage.removeItem('thos_token'); document.body.classList.remove('limited'); clearInterval(window.__tick); showLogin(msg); }
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button'); btn.disabled = true;
  try {
    const { token: t } = await api('/login', { method: 'POST', body: { password: $('#pw').value } });
    token = t; localStorage.setItem('thos_token', t); $('#pw').value = '';
    start();
  } catch (err) { $('#loginErr').textContent = err.message; }
  btn.disabled = false;
});
$('#logout').addEventListener('click', () => logout());
$('#menuBtn').addEventListener('click', () => $('#app').classList.toggle('menu'));

/* ================= data helpers ================= */
async function clients(force) { if (force || !cache.clients) cache.clients = await A('/clients'); return cache.clients; }
async function contracts(force) { if (force || !cache.contracts) cache.contracts = await A('/contracts'); return cache.contracts; }
const bust = () => { delete cache.clients; delete cache.contracts; };
async function refreshLeadBadge() {
  try { const l = await A('/leads'); const n = l.filter(x => x.status === 'new').length; const b = $('#leadBadge'); b.hidden = !n; b.textContent = n; } catch {}
}

/* ================= modal + form builder ================= */
function modal({ title, body, wide, foot }) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-h"><h2>${esc(title)}</h2><button class="modal-x" aria-label="Close">×</button></div>
    <div class="modal-b"></div>${foot ? '<div class="modal-f"></div>' : ''}</div>`;
  const m = bg.firstElementChild;
  if (typeof body === 'string') $('.modal-b', m).innerHTML = body; else $('.modal-b', m).appendChild(body);
  if (foot) { if (typeof foot === 'string') $('.modal-f', m).innerHTML = foot; else $('.modal-f', m).appendChild(foot); }
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  $('.modal-x', m).addEventListener('click', close);
  bg.addEventListener('mousedown', (e) => { if (e.target === bg) close(); });
  document.body.appendChild(bg);
  setTimeout(() => { const f = m.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea'); f && f.focus(); }, 30);
  return { el: m, close };
}

async function fieldHTML(f, val) {
  const id = 'f_' + f.k;
  const req = f.req ? ' required' : '';
  const v = val ?? f.def ?? '';
  let input;
  switch (f.t) {
    case 'textarea': input = `<textarea id="${id}" name="${f.k}"${req}>${esc(v)}</textarea>`; break;
    case 'select': input = `<select id="${id}" name="${f.k}"${req}>${f.opts.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o[0].toUpperCase() + o.slice(1)]; return `<option value="${esc(ov)}"${String(ov) === String(v) ? ' selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`; break;
    case 'client': {
      const cs = await clients();
      input = `<select id="${id}" name="${f.k}"${req}><option value="">${f.req ? 'Choose a client' : 'Not linked to a client'}</option>${cs.map(c => `<option value="${c.id}"${String(c.id) === String(v) ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`;
      break;
    }
    case 'contract': input = `<select id="${id}" name="${f.k}" data-val="${esc(v)}"><option value="">Not linked to a contract</option></select>`; break;
    case 'money': input = `<input id="${id}" name="${f.k}" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(v)}"${req}>`; break;
    case 'number': input = `<input id="${id}" name="${f.k}" type="number" step="1" value="${esc(v)}"${req}>`; break;
    case 'date': input = `<input id="${id}" name="${f.k}" type="date" value="${esc(String(v).slice(0,10))}"${req}>`; break;
    case 'month': input = `<input id="${id}" name="${f.k}" type="month" value="${esc(String(v).slice(0,7))}"${req}>`; break;
    case 'checkbox': return `<div class="f ${f.full ? 'full' : ''}"><label class="check"><input type="checkbox" name="${f.k}"${v === true || v === 'true' || v === '' && f.def ? ' checked' : ''}> ${esc(f.l)}</label></div>`;
    default: input = `<input id="${id}" name="${f.k}" type="${f.t || 'text'}" value="${esc(v)}"${req}>`;
  }
  return `<div class="f ${f.full || f.t === 'textarea' ? 'full' : ''}"><label for="${id}">${esc(f.l)}${f.req || f.t === 'select' ? '' : ' <span style="font-weight:400;color:var(--muted)">(optional)</span>'}</label>${input}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</div>`;
}

// Fill the contract select based on the chosen client
async function wireLinkedSelects(form) {
  const cSel = form.querySelector('[name=client_id]');
  const kSel = form.querySelector('select[name=contract_id]');
  if (!cSel || !kSel) return;
  const cons = await contracts();
  const fill = () => {
    const keep = kSel.value || kSel.dataset.val;
    kSel.innerHTML = `<option value="">Not linked to a contract</option>` + cons.filter(k => String(k.client_id) === cSel.value).map(k => `<option value="${k.id}"${String(k.id) === String(keep) ? ' selected' : ''}>${esc(k.title)}</option>`).join('');
  };
  cSel.addEventListener('change', fill); fill();
}

function readForm(form, fields) {
  const out = {};
  for (const f of fields) {
    const el = form.elements[f.k];
    if (!el) continue;
    let v = f.t === 'checkbox' ? el.checked : el.value.trim();
    if (f.t === 'month' && v) v = v + '-01';
    out[f.k] = v;
  }
  return out;
}

async function editRecord(cfg, rec = {}, presets = {}) {
  const isNew = !rec.id;
  const vals = { ...rec, ...presets };
  const form = document.createElement('form');
  form.className = 'fgrid'; form.noValidate = true;
  form.innerHTML = (await Promise.all(cfg.fields.map(f => fieldHTML(f, vals[f.k])))).join('') + '<p class="form-err full" hidden></p>';
  const foot = document.createElement('div');
  foot.style.cssText = 'display:contents';
  foot.innerHTML = `${!isNew && (!cfg.noDelete || !cfg.noDelete()) ? '<button class="btn danger" type="button" data-del>Delete</button>' : ''}<div class="right"><button class="btn" type="button" data-cancel>Cancel</button><button class="btn primary" type="button" data-save>${isNew ? 'Add ' + cfg.one : 'Save changes'}</button></div>`;
  const m = modal({ title: cfg.title_ ? cfg.title_(isNew, vals) : (isNew ? 'Add ' : 'Edit ') + cfg.one, body: form, foot });
  await wireLinkedSelects(form);
  if (cfg.onForm) cfg.onForm(form, rec, m);
  const errEl = form.querySelector('.form-err');
  const save = async () => {
    const data = readForm(form, cfg.fields);
    const missing = cfg.fields.find(f => f.req && !String(data[f.k] ?? '').trim());
    if (missing) { errEl.hidden = false; errEl.textContent = `Add ${missing.l.toLowerCase()} before saving.`; form.elements[missing.k].focus(); return; }
    const btn = $('[data-save]', m.el); btn.disabled = true;
    try {
      const saved = await A(`/${cfg.ep}${isNew ? '' : '/' + rec.id}`, { method: isNew ? 'POST' : 'PUT', body: cfg.prepSave ? cfg.prepSave(data) : data });
      m.close(); bust(); toast(cfg.savedMsg ? cfg.savedMsg(saved, isNew) : isNew ? `${cap(cfg.one)} added` : 'Changes saved'); route();
      if (cfg.ep === 'leads') refreshLeadBadge();
    } catch (e) { errEl.hidden = false; errEl.textContent = e.message; btn.disabled = false; }
  };
  form.addEventListener('submit', (e) => { e.preventDefault(); save(); });
  $('[data-save]', m.el).addEventListener('click', save);
  $('[data-cancel]', m.el).addEventListener('click', m.close);
  const del = $('[data-del]', m.el);
  if (del) del.addEventListener('click', async () => {
    if (!confirm(`Delete this ${cfg.one}? This can’t be undone.`)) return;
    try { await A(`/${cfg.ep}/${rec.id}`, { method: 'DELETE' }); m.close(); bust(); toast(`${cap(cfg.one)} deleted`); route(); }
    catch (e) { errEl.hidden = false; errEl.textContent = e.message; }
  });
  return m;
}
const cap = (s) => s[0].toUpperCase() + s.slice(1);

/* ================= list configs ================= */
const METHODS = ['EFT','Cash','Card','PayFast','Yoco','Other'];
const EXP_CATS = ['Software & subscriptions','Hosting & domains','Printing & suppliers','Advertising (own)','Equipment','Transport','Salaries & contractors','Rent & office','Bank fees','Other'];
const PERIODS = [['all','All time'],['this','This month'],['last','Last month'],['year','This year'],['ytd12','Last 12 months']];
function inPeriod(iso, p) {
  if (p === 'all' || !iso) return true;
  const d = String(iso).slice(0,10), now = new Date();
  const ym = (y, m) => `${y}-${String(m + 1).padStart(2,'0')}`;
  const thisM = ym(now.getFullYear(), now.getMonth());
  const lastD = new Date(now.getFullYear(), now.getMonth() - 1, 1), lastM = ym(lastD.getFullYear(), lastD.getMonth());
  if (p === 'this') return d.startsWith(thisM);
  if (p === 'last') return d.startsWith(lastM);
  if (p === 'year') return d.startsWith(String(now.getFullYear()));
  if (p === 'ytd12') { const s = new Date(now.getFullYear(), now.getMonth() - 11, 1); return d >= ym(s.getFullYear(), s.getMonth()) + '-01'; }
  return true;
}

const TX_TYPES = [['payment','Money in'],['expense','Money out'],['charge','Amount owed (bill)'],['credit','Credit / write-off']];
const TX_PILL = { payment: ['good','In'], expense: ['mute','Out'], charge: ['warn','Bill'], credit: ['info','Credit'] };
const txPill = (t) => `<span class="pill ${TX_PILL[t][0]}">${TX_PILL[t][1]}</span>`;
const showField = (form, k, on) => { const el = form.elements[k]; if (el) el.closest('.f').hidden = !on; };

const LEAD_STATUSES = ['new','contacted','follow_up','quoted','won','lost'];
const LEAD_LABEL = { new: 'New', contacted: 'Contacted', follow_up: 'Follow up', quoted: 'Quoted', won: 'Won', lost: 'Lost' };
const HOW_OPTS = [['call','Phone call'],['whatsapp','WhatsApp'],['email','Email'],['sms','SMS'],['meeting','Meeting'],['walk_in','Walk-in'],['other','Other']];
const HOW_LABEL = { call: 'Call', whatsapp: 'WhatsApp', email: 'Email', sms: 'SMS', meeting: 'Meeting', walk_in: 'Walk-in', other: 'Other', created: 'Added' };
const CFG = {
  clients: {
    title: 'Clients', one: 'client', ep: 'clients', sub: 'Everyone you work with. Retainers can be switched between active and cancelled right here.',
    search: ['name','contact_person','email','phone','industry','notes'],
    prep: (rows) => rows.forEach(r => { r.state = r.billing === 'retainer' ? (r.retainer_active ? 'active' : 'cancelled') : 'once_off'; }),
    selects: [{ k: 'state', all: 'All clients', opts: [['active','Active retainers'],['cancelled','Cancelled retainers'],['once_off','Once-off clients']] }],
    cols: [
      { l: 'Client', r: c => `<strong>${esc(c.name)}</strong>${c.notes ? `<div class="muted" style="font-size:13px">${esc(c.notes.split('\n')[0]).slice(0, 60)}</div>` : ''}` },
      { l: 'Type', r: c => c.billing === 'retainer' ? 'Retainer' : '<span class="muted">Once-off</span>' },
      { l: 'Retainer', r: c => c.billing === 'retainer' ? `<button class="tog ${c.retainer_active ? 'on' : 'off'}" data-toggle="${c.id}" title="Click to change">${c.retainer_active ? 'Active' : 'Cancelled'}</button>` : '<span class="muted">–</span>' },
      { l: 'Unpaid months', cls: 'num', r: c => c.months_unpaid ? `<span class="neg">${c.months_unpaid}</span>` : '<span class="muted">–</span>' },
      { l: 'Balance owing', cls: 'money', sum: 'balance', r: c => `<span class="${num(c.balance) > 0 ? 'neg' : ''}">${money(c.balance, true)}</span>` },
    ],
    fields: [
      { k: 'name', l: 'Client name', req: true, full: true },
      { k: 'billing', l: 'Type', t: 'select', opts: [['retainer','Retainer (pays monthly)'],['once_off','Once-off']], def: 'once_off' },
      { k: 'retainer_active', l: 'Retainer is active', t: 'checkbox', def: true },
      { k: 'contact_person', l: 'Contact person' }, { k: 'phone', l: 'Phone', t: 'tel' },
      { k: 'email', l: 'Email', t: 'email' }, { k: 'industry', l: 'Industry' },
      { k: 'notes', l: 'Notes', t: 'textarea' },
    ],
    onForm(form) {
      const sync = () => { const r = form.elements.billing.value === 'retainer'; ['retainer_active'].forEach(k => showField(form, k, r)); };
      form.elements.billing.addEventListener('change', sync); sync();
    },
    afterRender(card) {
      card.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); toggleRetainer(b.dataset.toggle); }));
    },
    open: (c) => { location.hash = 'client/' + c.id; },
  },
  transactions: {
    title: 'Transactions', one: 'transaction', ep: 'transactions', sub: 'Your bank book: money in, money out and the running total. Click any row to edit or delete it.',
    search: ['client_name','description','reference','method','months','billed_for'], dateKey: 'tx_date', years: true, defPeriod: 'year', tableCls: 'bank',
    prep: (rows) => rows.forEach(r => { r.book = ['payment', 'expense'].includes(r.type) ? 'bank' : 'bills'; }),
    selects: [{ k: 'view', all: 'Everything', def: 'bank', opts: [['bank','Money in & out'],['payment','Money in only'],['expense','Money out only'],['bills','Bills & adjustments']],
      match: (r, v) => v === 'bank' || v === 'bills' ? r.book === v : r.type === v }],
    addPreset: (v) => ({ type: v === 'expense' ? 'expense' : v === 'bills' ? 'charge' : 'payment' }),
    cols: [
      { l: 'Date', tcls: 'd-only', r: t => `<span style="white-space:nowrap">${dt(t.tx_date)}</span>` },
      { l: 'Details', r: t => {
        const main = t.client_name ? `<strong>${esc(t.client_name)}</strong>${t.description ? ' · ' + esc(t.description) : ''}` : esc(t.description || '–');
        const extra = [t.book === 'bills' ? `${txPill(t.type)} ${money(t.amount)}` : '', t.months ? 'Paid: ' + esc(t.months) : '', t.billed_for ? 'Bill for ' + esc(t.billed_for) : '',
          t.method && t.type === 'payment' ? esc(t.method) + (t.reference ? ' · ' + esc(t.reference) : '') : ''].filter(Boolean);
        const mob = `<div class="m-only muted" style="font-size:13px">${dt(t.tx_date)}${t.type === 'payment' ? ` · <span class="tx-in">+${money(t.amount)}</span>` : t.type === 'expense' ? ` · <span class="tx-out">−${money(t.amount)}</span>` : ''}</div>`;
        return main + mob + (extra.length ? `<div class="muted" style="font-size:13px">${extra.join(' · ')}</div>` : '');
      } },
      { l: 'In', cls: 'money', tcls: 'd-only', r: t => t.type === 'payment' ? `<span class="tx-in">${money(t.amount)}</span>` : '' },
      { l: 'Out', cls: 'money', tcls: 'd-only', r: t => t.type === 'expense' ? `<span class="tx-out">${money(t.amount)}</span>` : '' },
      { l: 'Total', cls: 'money', r: t => t.running == null ? '<span class="muted">–</span>' : `<strong class="${num(t.running) < 0 ? 'neg' : ''}">${money(t.running)}</strong>` },
    ],
    footer(list) {
      const S = (ty) => list.filter(t => t.type === ty).reduce((a, t) => a + num(t.amount), 0);
      const inn = S('payment'), out = S('expense'), bills = S('charge'), cr = S('credit');

const TZ = 'Africa/Johannesburg';
const dtt = (iso) => { if (!iso) return '–'; const d = new Date(iso); return d.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', timeZone: TZ }) + ', ' + d.toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: TZ }); };
const hm = (iso) => new Date(iso).toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: TZ });
const todaySA = () => new Date().toLocaleDateString('en-CA', { timeZone: TZ });
const proofUrl = (activityId) => `/api/admin/proofs/${activityId}?t=${encodeURIComponent(token)}`;

// Shrink photos/screenshots before upload so they're quick to send and cheap to store.
function readProof(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    if (!/^image\//.test(file.type)) return reject(new Error('Upload a photo or screenshot (JPG or PNG).'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That picture couldn't be opened. Try a screenshot.")); };
    img.src = url;
  });
}
function proofField(required) {
  return `<div class="f full"><label>Proof${required ? '' : ' <span style="font-weight:400;color:var(--muted)">(optional for you)</span>'}</label>
    <label class="proof-drop" data-drop><input type="file" accept="image/*" data-proof><span data-ph>📎 Tap to add a screenshot of the call log, WhatsApp chat or email</span></label></div>`;
}
function wireProof(form) {
  const inp = $('[data-proof]', form), drop = $('[data-drop]', form); let data = null;
  inp.addEventListener('change', async () => {
    try { data = await readProof(inp.files[0]); const er = $('.form-err', form); if (er && data) er.hidden = true; drop.querySelector('[data-ph]').innerHTML = data ? `<img src="${data}" alt="Proof preview">Tap to change` : '📎 Tap to add a screenshot'; }
    catch (e) { data = null; toast(e.message, true); }
  });
  return () => data;
}

/* ================= time tracking ================= */
const dateSA = (iso) => new Date(iso).toLocaleDateString('en-CA', { timeZone: TZ });
const fmtH = (h) => { h = num(h); const m = Math.round(h * 60); return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`; };
const hoursOf = (e) => (new Date(e.ended_at || Date.now()) - new Date(e.started_at)) / 3600e3;
const weekStartSA = () => { const d = new Date(todaySA() + 'T12:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.toLocaleDateString('en-CA'); };
const localInput = (iso) => { if (!iso) return ''; const d = new Date(iso), z = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`; };
const TIME_PERIODS = [['week', 'This week'], ['today', 'Today'], ['month', 'This month'], ['last', 'Last month'], ['all', 'Last 12 months']];
function inTimePeriod(e, p) {
  const d = dateSA(e.started_at), t = todaySA();
  if (p === 'today') return d === t;
  if (p === 'week') return d >= weekStartSA();
  if (p === 'month') return d.slice(0, 7) === t.slice(0, 7);
  if (p === 'last') { const x = new Date(t + 'T12:00:00'); x.setDate(1); x.setMonth(x.getMonth() - 1); return d.slice(0, 7) === x.toLocaleDateString('en-CA').slice(0, 7); }
  return true;
}

  const menu = document.createElement('div');
  menu.className = 'smenu';
  menu.innerHTML = `<div class="hd">${esc(title)}${amount !== undefined ? `<div style="font-weight:500;margin-top:2px">${amount ? 'Billed ' + money(amount) : 'Not billed yet'}</div>` : ''}</div>` + [['rec', 'Received'], ['not_rec', 'Not received'], ['na', 'N/A (no fee this month)'], ['', 'Not due yet']]
    .map(([v, l]) => `<button type="button" data-v="${v}" class="${(current || '') === v ? 'on' : ''}"><i class="dot s-${v || 'up'}"></i>${l}</button>`).join('') + (amount !== undefined ? `<button type="button" data-v="__amt" style="border-top:1px solid var(--line)"><i class="dot" style="background:var(--lamp)"></i>${amount ? 'Change amount' : 'Bill this month'}</button>` : '');
  document.body.appendChild(menu);
  const r = anchor.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(r.left + scrollX, scrollX + innerWidth - menu.offsetWidth - 8)) + 'px';
  menu.style.top = (r.bottom + scrollY + 6) + 'px';
  menu.querySelector('button.on, button')?.focus();
  menu.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; menu.remove(); onPick(b.dataset.v); });
  const off = (ev) => { if (!menu.contains(ev.target) && ev.target !== anchor) { menu.remove(); document.removeEventListener('mousedown', off); } };
  setTimeout(() => document.addEventListener('mousedown', off), 0);
  menu.addEventListener('keydown', (e) => { if (e.key === 'Escape') { menu.remove(); anchor.focus(); } });
}
function wireCells(root, labelFor, after) {
  root.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    statusMenu(b, b.dataset.s, labelFor(b), async (v) => {
      if (v === b.dataset.s) return;
      try {
        if (v === '__amt') {
          const cur = num(b.dataset.a);
          const inp = prompt(`Amount for ${labelFor(b)} (R)\nThis is added to what they owe. Enter 0 to remove the bill.`, cur || '');
          if (inp === null) return;
          const a = Number(String(inp).replace(/[^0-9.]/g, '')) || 0;
          await A('/retainers/' + b.dataset.m, { method: 'PUT', body: { amount: a } });
          toast(a ? `Billed ${money(a)}` : 'Bill removed'); bust(); after(); return;
        }
        await A('/retainers/' + b.dataset.m, { method: 'PUT', body: { status: v } });
        toast(v === 'rec' ? 'Marked received, payment recorded' : v === 'not_rec' ? 'Marked not received' : v === 'na' ? 'Marked N/A' : 'Cleared');
        bust(); after();
      } catch (err) { toast(err.message, true); }
    }, num(b.dataset.a));
  }));
}
async function toggleRetainer(id) {
  const c = (await clients(true)).find(x => String(x.id) === String(id));
  if (!c) return;
  const turnOff = c.retainer_active;
  if (turnOff && !confirm(`Cancel ${c.name}'s retainer?\n\nEvery month after ${MONTHS[nowM() - 1]} will be set to N/A. Anything they still owe stays on their account.`)) return;
  try {
    await A('/clients/' + id, { method: 'PUT', body: { retainer_active: !turnOff } });
    bust(); toast(turnOff ? `${c.name}'s retainer cancelled` : `${c.name}'s retainer is active again`); route();
  } catch (e) { toast(e.message, true); }
}
function payFor(client_id, amount) {
  editRecord(CFG.transactions, {}, { type: 'payment', client_id, amount: amount > 0 ? amount.toFixed(2) : '' });
}

/* ================= month-end billing ================= */
async function billModal(year, month, after) {
  const body = document.createElement('div');
  const yrs = [year - 1, year, year + 1];
  body.innerHTML = `<p class="muted" style="margin:0 0 12px">Type what each retainer owes for the month. It's added to their balance and the month shows <b>Not rec</b> until they pay. Leave a box empty to skip someone.</p>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><select data-bm aria-label="Month">${MONTHS.map((m, i) => `<option value="${i + 1}"${i + 1 === month ? ' selected' : ''}>${m}</option>`).join('')}</select>
    <select data-by aria-label="Year">${yrs.map(y => `<option${y === year ? ' selected' : ''}>${y}</option>`).join('')}</select>
    <button type="button" class="btn sm" data-same style="margin-left:auto">Fill in last amounts</button></div>
    <div class="bill-list"><p class="empty">Loading…</p></div>`;
  const foot = document.createElement('div');
  foot.style.cssText = 'display:flex;align-items:center;gap:10px;width:100%';
  foot.innerHTML = `<span class="muted" data-tot style="margin-right:auto"></span><button type="button" class="btn" data-cancel>Cancel</button><button type="button" class="btn primary" data-save>Save bills</button>`;
  const M = modal({ title: 'Bill retainers', body, foot, wide: true });
  $('[data-cancel]', foot).onclick = M.close;
  let rows = [];
  const inputs = () => [...body.querySelectorAll('input[data-c]')];
  const total = () => { const t = inputs().reduce((a, i) => a + (Number(i.value) || 0), 0); const n = inputs().filter(i => Number(i.value) > 0).length; $('[data-tot]', foot).textContent = `${n} client${n === 1 ? '' : 's'} · ${money(t)}`; };
  const load = async () => {
    const y = Number($('[data-by]', body).value), m = Number($('[data-bm]', body).value);
    $('.bill-list', body).innerHTML = '<p class="empty">Loading…</p>';
    rows = await A(`/retainers/bill?year=${y}&month=${m}`);
    $('.bill-list', body).innerHTML = rows.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>Client</th><th class="money">Last bill</th><th class="money">${MONTHS[m - 1]} ${y} (R)</th></tr></thead><tbody>${rows.map(r => `<tr class="static">
      <td><strong>${esc(r.name)}</strong>${r.status === 'rec' ? ' <span class="pill good">Paid</span>' : ''}</td>
      <td class="money muted">${num(r.last_amount) ? money(r.last_amount) : '–'}</td>
      <td class="money"><input data-c="${r.client_id}" data-last="${num(r.last_amount)}" inputmode="decimal" placeholder="0" value="${num(r.amount) ? num(r.amount) : ''}" aria-label="${esc(r.name)} amount" style="width:110px;text-align:right"></td></tr>`).join('')}</tbody></table></div>`
      : '<p class="empty">No active retainers for this month.</p>';
    inputs().forEach(i => i.addEventListener('input', total)); total();
    inputs()[0]?.focus();
  };
  $('[data-bm]', body).onchange = load; $('[data-by]', body).onchange = load;
  $('[data-same]', body).onclick = () => { inputs().forEach(i => { if (!i.value && Number(i.dataset.last)) i.value = i.dataset.last; }); total(); };
  $('[data-save]', foot).onclick = async (e) => {
    const y = Number($('[data-by]', body).value), m = Number($('[data-bm]', body).value);
    const items = inputs().map(i => {
      const r = rows.find(x => String(x.client_id) === i.dataset.c);
      const v = i.value.trim().replace(/[^0-9.]/g, '');
      if (v === '' && !num(r.amount)) return null;          // left empty and never billed: skip
      return { client_id: Number(i.dataset.c), amount: v === '' ? 0 : Number(v) };
    }).filter(Boolean);
    e.target.disabled = true;
    try { const r = await A('/retainers/bill', { method: 'POST', body: { year: y, month: m, items } }); M.close(); bust(); toast(`Billed ${r.n} client${r.n === 1 ? '' : 's'} for ${MONTHS[m - 1]} · ${money(r.total)}`); after && after(); }
    catch (err) { toast(err.message, true); e.target.disabled = false; }
  };
  load();
}

// Correct a balance in one step: saves the difference as an adjustment so the history stays intact.
function editBalance(r, after) {
  const cur = num(r.balance);
  const body = document.createElement('form');
  body.innerHTML = `<p style="margin:0 0 14px">Balance now: <strong>${money(cur)}</strong></p>
    <label for="nb" style="display:block;font-weight:600;margin-bottom:6px">Correct balance (R)</label>
    <input id="nb" inputmode="decimal" value="${cur}" style="width:100%">
    <label for="nr" style="display:block;font-weight:600;margin:14px 0 6px">Note <span class="muted" style="font-weight:400">(optional)</span></label>
    <input id="nr" placeholder="For example: matched to my sheet" style="width:100%">
    <p class="muted" data-diff style="margin:12px 0 0;font-size:13px"></p>`;
  const foot = document.createElement('div');
  foot.style.cssText = 'display:flex;gap:10px;justify-content:flex-end;width:100%';
  foot.innerHTML = `<button type="button" class="btn" data-x>Cancel</button><button type="button" class="btn primary" data-ok>Save balance</button>`;
  const M = modal({ title: 'Edit balance · ' + r.name, body, foot });
  const nb = $('#nb', body), diff = () => (Number(String(nb.value).replace(/[^0-9.\-]/g, '')) || 0) - cur;
  const show = () => { const d = diff(); $('[data-diff]', body).textContent = !d ? 'No change.' : d > 0 ? `Adds ${money(d)} as an amount owed.` : `Takes off ${money(-d)} as a credit.`; };
  nb.addEventListener('input', show); show(); setTimeout(() => nb.select(), 40);
  $('[data-x]', foot).onclick = M.close;
  const save = async () => {
    const d = Math.round(diff() * 100) / 100;
    if (!d) return M.close();
    try {
      await A('/transactions', { method: 'POST', body: { type: d > 0 ? 'charge' : 'credit', client_id: r.id, amount: Math.abs(d), tx_date: todayISO(), description: 'Balance adjustment' + ($('#nr', body).value.trim() ? ': ' + $('#nr', body).value.trim() : ''), allocate: false } });
      M.close(); bust(); toast(`${r.name} now owes ${money(cur + d)}`); after && after();
    } catch (err) { toast(err.message, true); }
  };
  $('[data-ok]', foot).onclick = save;
  body.addEventListener('submit', (e) => { e.preventDefault(); save(); });
}

      t => `<tr data-t="${t.id}" tabindex="0"><td>${dt(t.tx_date)}</td><td>${txPill(t.type)}</td><td>${esc(t.description || '')}${t.months ? `<div class="muted" style="font-size:13px">Paid: ${esc(t.months)}</div>` : ''}${t.billed_for ? `<div class="muted" style="font-size:13px">Bill for ${esc(t.billed_for)}</div>` : ''}</td><td class="money ${t.type === 'payment' ? 'tx-in' : ''}">${t.type === 'payment' ? '+' : ''}${money(t.amount)}</td></tr>`,
      'Nothing recorded yet.')}
    ${mini('Contracts', d.contracts, '<th>Contract</th><th>Type</th><th>Dates</th><th>Status</th><th class="money">Value</th>',
      k => `<tr data-k="${k.id}" tabindex="0"><td><strong>${esc(k.title)}</strong></td><td>${pill(k.kind)}</td><td>${dt(k.start_date)} to ${dt(k.end_date)}</td><td>${pill(k.status)}</td><td class="money">${money(k.value)}</td></tr>`,
      'No contracts yet.', '<button data-addk>Add contract</button>')}`;
  $('[data-edit]', main).onclick = () => editRecord(CFG.clients, c);
  $('[data-pay]', main).onclick = () => payFor(c.id, 0);
  $('[data-owe]', main).onclick = () => editRecord(CFG.transactions, {}, { type: 'charge', client_id: c.id });
  $('[data-bal]', main).onclick = () => editBalance({ id: c.id, name: c.name, balance: c.balance }, () => clientView(id));
  $('[data-addk]', main).onclick = () => editRecord(CFG.contracts, {}, { client_id: c.id });
  const tg = $('[data-toggle]', main); if (tg) tg.onclick = () => toggleRetainer(c.id);
  main.querySelectorAll('[data-t]').forEach(tr => tr.onclick = () => editRecord(CFG.transactions, d.transactions.find(t => String(t.id) === tr.dataset.t)));
  main.querySelectorAll('[data-k]').forEach(tr => tr.onclick = () => editRecord(CFG.contracts, d.contracts.find(k => String(k.id) === tr.dataset.k)));
  const strip = $('#strip', main);
  if (strip) wireCells(strip, (b) => { const row = b.parentElement; const y = row.querySelector('.yl').textContent; const i = [...row.children].indexOf(b) - 1; return `${MONTHS[i]} ${y}`; }, () => clientView(id));
}

/* ================= dashboard ================= */
async function dashboardView() {
  const main = $('#main');
  const now = new Date();
  main.innerHTML = `<div class="page-head"><div><h1>Dashboard</h1><p class="sub">${MONTHS[now.getMonth()]} ${now.getFullYear()} at a glance</p></div><div class="actions"><button class="btn" data-out>Money out</button><button class="btn" data-bill>Bill ${MONTHS[now.getMonth()]}</button><button class="btn primary" data-pay>Money in</button></div></div><p class="empty">Loading…</p>`;
  $('[data-bill]', main).onclick = () => billModal(now.getFullYear(), now.getMonth() + 1, dashboardView);
  $('[data-out]', main).onclick = () => editRecord(CFG.transactions, {}, { type: 'expense' });
  $('[data-pay]', main).onclick = () => editRecord(CFG.transactions, {}, { type: 'payment' });
  const d = await A('/dashboard');
  const K = d.kpis;
  const diff = K.incomeMonth - K.incomeLast;
  const tile = (l, v, n, href, alert) => `<a class="card kpi ${alert ? 'alert' : ''}" href="${href}"><div class="k-label">${l}</div><div class="k-val">${v}</div><div class="k-note">${n}</div></a>`;
  $('.empty', main).outerHTML = `
    <div class="kpis">
      ${tile('Money in this month', money(K.incomeMonth), K.incomeLast ? `${diff >= 0 ? '▲' : '▼'} ${money(Math.abs(diff))} vs last month` : 'Payments received', '#transactions')}
      ${tile('Money out this month', money(K.outMonth), 'Ads, Shopify, printing and so on', '#transactions')}
      ${tile('Bank total', money(K.bank), 'Running total from your bank book', '#transactions', K.bank < 0)}
      ${tile('Billed this month', money(K.billedMonth), 'Amounts owed added this month', '#retainers')}
      ${tile('Owed to you', money(K.outstanding), 'All clients', '#debtors', K.outstanding > 0)}
      ${tile('Billed, not received', money(K.notRecAmt), `${K.notRecCount} retainer month${K.notRecCount === 1 ? '' : 's'} waiting`, '#retainers')}
      ${tile('Active retainers', K.activeRet, K.unbilled ? `${K.unbilled} not billed for ${MONTHS[now.getMonth()]} yet` : 'Retainer clients', '#retainers')}
      ${tile('New leads', K.newLeads, 'From the website, not yet contacted', '#leads')}
    </div>
    <div class="card chart-card">
      <div class="card-h"><h2>Money in and out, last 12 months</h2><div style="display:flex;gap:16px;align-items:center"><div class="legend"><span><i style="background:var(--income)"></i>In</span><span><i style="background:var(--expense)"></i>Out</span></div><button data-tbl>Show table</button></div></div>
      <div class="chart" id="chart"></div>
      <div class="table-wrap" id="chartTable" hidden><table class="t"><thead><tr><th>Month</th><th class="money">In</th><th class="money">Out</th><th class="money">Net</th><th class="money">Billed</th></tr></thead>
        <tbody>${d.series.map(s => `<tr class="static"><td>${s.label}</td><td class="money">${money(s.income)}</td><td class="money">${money(s.out)}</td><td class="money ${num(s.income) - num(s.out) < 0 ? 'neg' : ''}">${money(num(s.income) - num(s.out))}</td><td class="money">${money(s.billed)}</td></tr>`).join('')}</tbody></table></div>
    </div>
    <div class="dash-grid">
      <div class="card"><div class="card-h"><h2>Biggest balances</h2><a href="#debtors">All debtors</a></div>
        ${d.topDebtors.length ? `<ul class="list">${d.topDebtors.map(t => `<li><div><a href="#client/${t.client_id}" style="color:inherit;font-weight:600;text-decoration:none">${esc(t.client_name)}</a><div class="sub">${t.billing === 'retainer' ? 'Retainer' : 'Once-off'}</div></div><div><strong>${money(t.balance)}</strong></div></li>`).join('')}</ul>` : '<p class="empty">Nobody owes you anything right now.</p>'}</div>
      <div class="card"><div class="card-h"><h2>Contracts ending soon</h2><a href="#contracts">All contracts</a></div>
        ${d.ending.length ? `<ul class="list">${d.ending.map(k => `<li><div><strong>${esc(k.client_name)}</strong><div class="sub">${esc(k.title)}</div></div><div><span class="neg">${dt(k.end_date)}</span><div class="sub">${money(k.value)}${k.kind === 'retainer' ? ' /mo' : ''}</div></div></li>`).join('')}</ul>` : '<p class="empty">No contracts end in the next 45 days.</p>'}</div>
      <div class="card"><div class="card-h"><h2>Latest payments</h2><a href="#transactions">All transactions</a></div>
        ${d.recentPayments.length ? `<ul class="list">${d.recentPayments.map(p => `<li><div><strong>${esc(p.client_name)}</strong><div class="sub">${dt(p.paid_on)}${p.description ? ' · ' + esc(p.description) : ''}</div></div><div class="pos"><strong>${money(p.amount)}</strong></div></li>`).join('')}</ul>` : '<p class="empty">No payments recorded yet.</p>'}</div>
    </div>`;
  $('[data-tbl]', main).onclick = (e) => { const t = $('#chartTable'); t.hidden = !t.hidden; $('#chart').hidden = !t.hidden; e.target.textContent = t.hidden ? 'Show table' : 'Show chart'; };
  drawChart($('#chart'), d.series);
}

function drawChart(el, series) {
  const W = Math.max(el.clientWidth - 36, 320), H = 260, padL = 58, padB = 28, padT = 10;
  const max = Math.max(1, ...series.flatMap(s => [num(s.income), num(s.out)]));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const y = (v) => padT + (H - padT - padB) * (1 - v / top);
  const band = (W - padL) / series.length, bw = Math.min(18, (band - 10) / 2);
  let g = '';
  for (let v = 0; v <= top + 0.001; v += step) g += `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? '#eef0f4' : '#c9d0db'}"/><text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#6b7690">${moneyShort(v)}</text>`;
  const bar = (x, v, color) => { const h = y(0) - y(v); if (h <= 0) return ''; const r = Math.min(4, h); return `<path d="M${x},${y(0)} V${y(v) + r} Q${x},${y(v)} ${x + r},${y(v)} H${x + bw - r} Q${x + bw},${y(v)} ${x + bw},${y(v) + r} V${y(0)} Z" fill="${color}"/>`; };
  series.forEach((s, i) => {
    const cx = padL + band * i + band / 2;
    g += bar(cx - bw - 1, num(s.income), 'var(--income)') + bar(cx + 1, num(s.out), 'var(--expense)');
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#6b7690">${s.label.split(' ')[0]}</text>`;
    g += `<rect class="hit" data-i="${i}" x="${padL + band * i}" y="${padT}" width="${band}" height="${H - padT - padB}" fill="transparent"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of money in and out for the last 12 months">${g}</svg><div class="tip" hidden></div>`;
  const tip = $('.tip', el), svg = $('svg', el);
  svg.querySelectorAll('.hit').forEach(r => {
    r.addEventListener('mouseenter', () => {
      const s = series[r.dataset.i];
      const bb = r.getBoundingClientRect(), eb = el.getBoundingClientRect();
      tip.innerHTML = `<b>${s.label}</b><span>In <em style="font-style:normal">${money(s.income)}</em></span><span>Out <em style="font-style:normal">${money(s.out)}</em></span><span>Net <em style="font-style:normal">${money(num(s.income) - num(s.out))}</em></span>`;
      tip.hidden = false;
      tip.style.left = Math.min(Math.max(bb.left - eb.left + bb.width / 2, 90), eb.width - 90) + 'px';
      tip.style.top = (y(Math.max(num(s.income), num(s.out))) * (svg.getBoundingClientRect().height / H) + 4) + 'px';
      r.setAttribute('fill', 'rgba(11,19,32,.04)');
    });
    r.addEventListener('mouseleave', () => { tip.hidden = true; r.setAttribute('fill', 'transparent'); });
  });
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x || 1))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

/* ================= settings ================= */
async function settingsView() {
  const s = await A('/settings');
  const fields = [
    { k: 'business_name', l: 'Business name', full: true }, { k: 'phone', l: 'Phone' }, { k: 'email', l: 'Email', t: 'email' },
    { k: 'address', l: 'Address', t: 'textarea' },
    { k: 'bank_details', l: 'Banking details', t: 'textarea', hint: 'For statements and payment reminders' },
  ];
  $('#main').innerHTML = `<div class="page-head"><div><h1>Settings</h1><p class="sub">Your business details.</p></div></div>
    <form class="card fgrid" style="padding:22px;max-width:760px" id="setForm">${(await Promise.all(fields.map(f => fieldHTML(f, s[f.k])))).join('')}
    <div class="full"><button class="btn primary" type="submit">Save settings</button></div></form>`;
  $('#setForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try { await A('/settings', { method: 'PUT', body: { ...s, ...readForm(e.target, fields) } }); toast('Settings saved'); } catch (err) { toast(err.message, true); }
  });
  const team = document.createElement('div'); $('#main').appendChild(team); teamSection(team);
}

/* ================= router ================= */
async function route() {
  if (!ME) return;   // not logged in yet
  clearInterval(window.__tick);
  let h = location.hash.slice(1) || homeView();
  if (!isOwner() && !h.startsWith(homeView())) { h = homeView(); history.replaceState(null, '', '#' + h); }
  const [view, arg] = h.split('/');
  $('#app').classList.remove('menu');
  document.querySelectorAll('.side a.nav').forEach(a => a.classList.toggle('active', a.dataset.v === (view === 'client' ? 'clients' : view)));
  try {
    if (view === 'dashboard') await dashboardView();
    else if (view === 'retainers') await retainersView(arg);
    else if (view === 'debtors') await debtorsView();
    else if (view === 'time') await timeView();
    else if (view === 'client') await clientView(arg);
    else if (view === 'settings') await settingsView();
    else if (CFG[view]) await listView(CFG[view]);
    else location.hash = 'dashboard';
  } catch (e) { if (token) $('#main').innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
}
addEventListener('hashchange', route);
let resizeT; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if ((location.hash || '#dashboard') === '#dashboard') route(); }, 250); });

async function start() {
  $('#login').hidden = true; $('#app').hidden = false;
  try { ME = await A('/me'); } catch { return; }
  document.body.classList.toggle('limited', !isOwner());
  document.querySelectorAll('.side .nav').forEach(a => a.classList.toggle('allow', a.dataset.v === homeView()));
  $('#whoAmI').textContent = 'Logged in as ' + ME.name;
  refreshLeadBadge(); route();
}
token ? start() : showLogin();
})();
</script>
